name: CI

# Written for when Actions is enabled on this repository. Installing the
# @avalon-initiative packages needs a token that can read them: either grant this
# repository access to those packages in their settings (then GITHUB_TOKEN is
# enough) or add a PACKAGES_READ_TOKEN secret with read:packages.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/hub-app/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checks (both apps)
        run: bash scripts/release-checks.sh all
