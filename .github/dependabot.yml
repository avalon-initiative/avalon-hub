version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      github-actions-all:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/apps/hub-app/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
