name: Release web app

# Pushing a hub-v<X.Y.Z>[-title] tag (created by `make release-hub`) verifies the
# tag, runs the web app's checks, builds it, and publishes the built bundle as a
# GitHub Release asset. Written for when Actions is enabled on this repository.
on:
  push:
    tags: ["hub-v*"]

permissions:
  contents: write
  packages: read

concurrency:
  group: release-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to release."; exit 1; }

      - name: Verify tag matches the version files
        run: bash scripts/verify-release-version.sh "${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checks
        run: bash scripts/release-checks.sh hub

      - name: Package the built bundle
        run: tar -czf "avalon-hub-web-${GITHUB_REF_NAME}.tar.gz" -C apps/hub/dist .

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" "avalon-hub-web-${GITHUB_REF_NAME}.tar.gz" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
